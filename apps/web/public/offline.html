<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EC5A13" />
    <title>Нет сети – Клуб права</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        font-family: "HSE Sans", system-ui, sans-serif;
        background: #fbf3e8;
        color: #14181f;
      }
      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #ec5a13;
        display: grid;
        place-items: center;
      }
      .mark img { width: 36px; height: 36px; }
      h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.2;
      }
      p {
        margin: 0 0 22px;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #5c5648;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 12px 22px;
        font: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        background: #ec5a13;
        color: #fbf3e8;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #11296b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <img src="/icon-192.png" alt="" width="36" height="36" />
      </div>
      <h1>Нет подключения</h1>
      <p>Оболочка клуба открыта офлайн. Проверьте сеть и обновите – каталог и кабинет требуют связи.</p>
      <button type="button" onclick="location.reload()">Обновить</button>
    </main>
  </body>
</html>
