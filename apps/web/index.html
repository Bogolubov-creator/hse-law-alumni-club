<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Превью ссылки в мессенджерах (абсолютные URL – их читают скрейперы без JS) -->

    <meta property="og:url" content="%SITE_URL%/" />
    <!-- Превью-карточка 1200×630 (apps/web/public/brand/og-image.jpg) – широкий формат для мессенджеров. -->
    <meta property="og:image" content="%SITE_URL%/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Клуб выпускников факультета права НИУ ВШЭ" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Клуб выпускников факультета права НИУ ВШЭ" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Клуб выпускников факультета права Вышки" />
    <meta name="twitter:description" content="Реестр выпускников факультета права НИУ ВШЭ: статус, скидка на ДПО, события, сообщество." />
    <meta name="twitter:image" content="%SITE_URL%/brand/og-image.jpg" />
    <meta name="robots" content="index, follow" />
    <!-- Structured data: организация + сайт (schema.org). Виден всем краулерам, включая non-JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "%SITE_URL%/#club",
            "name": "Клуб выпускников факультета права НИУ ВШЭ",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/icon-512.png",
            "image": "%SITE_URL%/brand/og-image.jpg",
            "sameAs": ["https://t.me/pravohse"],
            "email": "pravo@hse.ru",
            "telephone": "+7-495-771-32-32",
            "foundingDate": "2024",
            "areaServed": "RU",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "pravo@hse.ru",
              "telephone": "+7-495-771-32-32",
              "availableLanguage": "Russian"
            },
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "ул. Мясницкая, д. 20",
              "addressLocality": "Москва",
              "postalCode": "101000",
              "addressCountry": "RU"
            },
            "parentOrganization": {
              "@type": "CollegeOrUniversity",
              "name": "НИУ «Высшая школа экономики»",
              "url": "https://pravo.hse.ru"
            }
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Клуб выпускников факультета права НИУ ВШЭ",
            "inLanguage": "ru-RU",
            "publisher": { "@id": "%SITE_URL%/#club" }
          }
        ]
      }
    </script>
    <!-- Шрифты со своего домена, а не с fonts.googleapis.com: нет внешней
         зависимости и IP посетителя не уходит в Google (см. public/fonts/fonts.css). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Начертания первого экрана грузим заранее, чтобы заголовок не переписывался -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/HSESans-Regular.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/HSESans-Black.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/HSESlab-Black.woff2" />
    <!-- Палитра оформления v2 до первого рендера, чтобы не было вспышки другой
         палитры. Оверрайд для QA и спецпроектов: ?palette=strict|warm (паттерн
         как у ?platform= в lib/use-mobile.ts) – запоминается в localStorage;
         без параметра читается сохранённое, иначе умолчание strict (выбор
         директивы 2026-09 по сравнению вариантов, см. tokens.css). -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var q = new URLSearchParams(location.search).get("palette");
          if (q === "strict" || q === "warm") localStorage.setItem("club_palette", q);
          root.dataset.palette = localStorage.getItem("club_palette") === "warm" ? "warm" : "strict";
        } catch (e) {
          root.dataset.palette = "strict";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
