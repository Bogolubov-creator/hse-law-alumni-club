name: club-local
services:
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:9443:443"
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    networks: [default, browser]
    ports:
      - "127.0.0.1:8025:8025"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
