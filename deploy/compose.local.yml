name: club-local
services:
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:9443:443"
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    networks: [default, browser]
    ports:
      - "127.0.0.1:8025:8025"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
