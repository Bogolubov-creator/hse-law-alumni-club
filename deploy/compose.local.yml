name: club-local
services:
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:9443:443"
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    networks: [default, browser]
    ports:
      - "127.0.0.1:8025:8025"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
