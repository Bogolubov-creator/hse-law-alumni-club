name: club-local
services:
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:9443:443"
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    networks: [default, browser]
    ports:
      - "127.0.0.1:8025:8025"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
