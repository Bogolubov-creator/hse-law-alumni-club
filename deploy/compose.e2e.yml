# Дополнение основного Compose только для scripts/test-live.sh.
# Выход контейнеров в интернет закрыт; SMTP заканчивается в Mailpit.
services:
  api:
    environment:
      JOBS_ENABLED: "false"
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:8180:80"
      - "127.0.0.1:8181:8081"
  mailpit:
    image: axllent/mailpit@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - "127.0.0.1:8182:8025"
    security_opt: ["no-new-privileges:true"]
    networks: [default, browser]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
