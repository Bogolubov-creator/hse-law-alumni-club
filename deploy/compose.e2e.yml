services:
  api:
    environment:
      JOBS_ENABLED: "false"
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:8180:80"
      - "127.0.0.1:8181:8081"
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:8182:8025"
    security_opt: ["no-new-privileges:true"]
    networks: [default, browser]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
