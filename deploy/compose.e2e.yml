services:
  api:
    environment:
      JOBS_ENABLED: "false"
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:8180:80"
      - "127.0.0.1:8181:8081"
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "127.0.0.1:8182:8025"
    security_opt: ["no-new-privileges:true"]
    networks: [default, browser]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
