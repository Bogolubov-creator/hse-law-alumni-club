services:
  api:
    environment:
      JOBS_ENABLED: "false"
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:8180:80"
      - "127.0.0.1:8181:8081"
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:8182:8025"
    security_opt: ["no-new-privileges:true"]
    networks: [default, browser]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
