services:
  api:
    environment:
      JOBS_ENABLED: "false"
  caddy:
    networks: [default, browser]
    ports: !override
      - "127.0.0.1:8180:80"
      - "127.0.0.1:8181:8081"
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "127.0.0.1:8182:8025"
    security_opt: ["no-new-privileges:true"]
    networks: [default, browser]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  default:
    internal: true
  browser:
