<section class="dpo-catalog-controls" id="program-list" aria-label="Подбор и фильтры программ">
<button type="button" class="dpo-filter-launch" data-dpo-filter-open>Фильтры и поиск <span data-dpo-filter-total>{{ catalog_chips|length }}</span></button>
<div class="dpo-filters-host">
<form class="dpo-filter-form" method="get" action="/dpo#program-list" data-dpo-filters>
<input type="hidden" name="compare" value="{{ query.get('compare','') }}">
<div class="dpo-search-sort">
<label>Поиск<input type="search" name="q" value="{{ query.get('q','') }}" placeholder="Название, тема или преподаватель" maxlength="200"></label>
<label>Порядок<select name="sort" aria-label="Порядок">{% for value,label in [('title','По названию'),('start','По дате начала'),('price','Сначала дешевле'),('price-desc','Сначала дороже')] %}<option value="{{ value }}" {% if query.get('sort','title')==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
</div>
<div class="dpo-filter-groups">
{% for name,values in filters.items() %}<details><summary>{{ filter_labels[name] }} <span data-filter-selected="{{ name }}">{{ catalog_selected[name]|length or '' }}</span></summary>
<fieldset><legend>{{ filter_labels[name] }}</legend>{% for value in values %}<label><input type="checkbox" name="{{ name }}" value="{{ value }}" {% if value in catalog_selected[name] %}checked{% endif %}><span>{{ organizer_labels.get(value, format_labels.get(value, {'actual':'Набор открыт','nonactual':'Набор закрыт'}.get(value,value))) }}</span></label>{% endfor %}</fieldset>
</details>{% endfor %}
</div>
<div class="dpo-filter-footer">
<p data-dpo-filter-preview role="status"></p>
<div class="site-actions dpo-filter-actions"><button class="site-primary" data-dpo-filter-apply>Показать</button><a href="{{ catalog_reset }}" data-dpo-reset>Сбросить</a><button type="button" data-dpo-filter-cancel>Отмена</button></div>
</div>
</form>
</div>
<div class="dpo-active-filters" aria-label="Выбранные фильтры" data-dpo-chips>{% for chip in catalog_chips %}<a href="{{ chip.href }}" data-dpo-chip="{{ chip.name }}" data-value="{{ chip.value }}" aria-label="Убрать фильтр: {{ chip.label }}">{{ chip.label }} ×</a>{% endfor %}</div>
</section>
<dialog class="dpo-filter-dialog" id="dpo-filter-dialog" aria-labelledby="dpo-filter-title"><header><h2 id="dpo-filter-title">Подбор программы</h2><button type="button" data-dpo-filter-close aria-label="Закрыть фильтры">×</button></header><div data-dpo-filter-content></div></dialog>
