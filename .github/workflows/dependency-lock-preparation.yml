name: Prepare dependency lockfile

on:
  push:
    branches: [codex/dependency-audit-2026-10-23]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve and verify Go module checksums
        run: docker build --file deploy/edge.Dockerfile --target edge-lock-export --output "type=local,dest=$RUNNER_TEMP/caddy-lock" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: caddy-lock-${{ github.sha }}
          path: ${{ runner.temp }}/caddy-lock/
          retention-days: 1
          if-no-files-found: error
