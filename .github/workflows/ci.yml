name: Security & CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmariadb-dev pkg-config
          uv sync --directory backend --frozen
          uv sync --directory scripts --frozen

      - name: Install web dependencies and Chromium
        run: |
          uv sync --directory frontend --frozen
          uv run --directory frontend playwright install --with-deps chromium
      - name: Check Python and browser source
        run: |
          uv run --directory backend python manage.py check
          uv run --directory frontend python manage.py check
          uv run --directory backend ruff check club_api tests/python ../scripts/club_ops
          uv run --directory backend ruff format --check club_api tests/python ../scripts/club_ops
          uv run --directory frontend ruff check club_web tests/python
          uv run --directory frontend ruff format --check club_web tests/python
          uv run --directory frontend python ../scripts/checks/check-comments.py
      - name: Validate operator commands and deployment configuration
        run: |
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -type d -name .venv -prune -o -type f -name '*.sh' -print0)
          python3 scripts/tests/test-ops.py
          python3 scripts/tests/test-install.py
          uv run --directory backend python ../scripts/tests/test-measure-load.py
          uv run --directory frontend python ../scripts/tests/test-comments.py
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example config --format json | python3 scripts/checks/check-compose.py
      - name: Build and check native web files
        run: |
          uv run --directory frontend python -m club_web.build --output /tmp/club-native-web
          uv run --directory frontend python ../scripts/checks/check-web-build.py /tmp/club-native-web
      - name: Test API, templates and browser flows
        run: |
          uv run --directory backend pytest -q
          uv run --directory frontend pytest -q
      - name: Audit Python runtime and development dependencies
        run: |
          for project in backend frontend scripts; do
            for scope in runtime development; do
              flags=()
              if [[ "$scope" == runtime ]]; then flags+=(--no-dev); fi
              uv export --directory "$project" --frozen --no-emit-project --no-emit-local "${flags[@]}" --format requirements-txt --output-file "/tmp/club-$project-$scope.txt" >/dev/null
              uv run --directory frontend pip-audit -r "/tmp/club-$project-$scope.txt" --no-deps --disable-pip
            done
          done

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmariadb-dev pkg-config
          uv sync --directory backend --frozen
          uv sync --directory scripts --frozen
      - name: Python API against disposable PostgreSQL
        run: bash scripts/tests/test-integration.sh

  mariadb-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - name: Install MariaDB from Ubuntu and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-server libmariadb-dev pkg-config
          sudo systemctl start mariadb
          uv sync --directory backend --frozen
          uv sync --directory scripts --frozen
      - name: Prepare a disposable database
        run: |
          sudo mariadb <<'SQL'
          CREATE DATABASE django_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
          CREATE USER 'club_test_operator'@'localhost' IDENTIFIED BY 'synthetic-mariadb-operator-test-only';
          GRANT ALL PRIVILEGES ON django_migration_test.* TO 'club_test_operator'@'localhost' WITH GRANT OPTION;
          GRANT CREATE USER ON *.* TO 'club_test_operator'@'localhost';
          SQL
      - name: Check Django migrations, restricted API role and application behavior
        env:
          CLUB_TEST_DATABASE_URL: mariadb://club_test_operator:synthetic-mariadb-operator-test-only@127.0.0.1:3306/django_migration_test
        run: bash scripts/tests/test-mariadb-integration.sh

  live-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
      - name: Install browser tests
        run: |
          uv sync --directory frontend --frozen
          uv run --directory frontend playwright install --with-deps chromium
      - name: Build images and check real persistence in desktop and mobile browsers
        run: bash scripts/tests/test-live.sh
      - name: Check final runtime image contents
        run: bash scripts/checks/check-runtime-images.sh club-ci-live-api club-ci-live-bootstrap club-ci-live-web
      - name: Check Caddy backports and reachable Go vulnerabilities
        run: docker build --file deploy/edge.Dockerfile --target edge-check --tag club-ci-edge-check .
      - name: Check Caddy TLS and perimeter with final images
        run: python3 scripts/tests/test-edge.py --edge-image club-ci-live-caddy --web-image club-ci-live-web --api-image club-ci-live-api
      - name: Check nginx TLS, request limits and proxy headers
        run: python3 scripts/tests/test-nginx.py --application-image club-ci-live-api
      - name: Scan application images (HIGH and CRITICAL)
        run: |
          for service in api bootstrap web caddy postgres; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "club-ci-live-$service"
          done
      - name: Install and repeat on Ubuntu with local TLS
        run: bash scripts/tests/test-install.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Scan repository files with Gitleaks
        run: >-
          docker run --rm --network none --read-only
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner
