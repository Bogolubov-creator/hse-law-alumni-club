version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: gomod
    directory: "/deploy/caddy"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(edge)"

  - package-ecosystem: pip
    directories: ["/backend", "/scripts"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(python)"
