name: club-pravo-hse

# Единые лимиты логов: не дать json-file-логам забить диск на долгоживущем VPS.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Пин по digest (не только по тегу): major-тег молча тянет любой новый минор.
    # Обновление — осознанным PR (Dependabot умеет обновлять digest). Проверить/обновить
    # digest: docker manifest inspect postgres:16-alpine
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume — переживает пересоздание (доп. п.4)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g   # подберите под размер VPS; защита от OOM всего хоста
    logging: *default-logging

  directus:
    # Пин по digest: админка с ПДн не должна молча съезжать на непроверенный минор.
    # Обновлять осознанным PR. Проверить digest: docker manifest inspect directus/directus:11
    image: directus/directus:11.17.4@sha256:eb326f679ae847c0a776f93b972761dc2ebe84980e0b9d274a6bc31cd62809f7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      # Studio-домен из env; "true" (любой origin) — только для локали.
      CORS_ORIGIN: ${DIRECTUS_CORS_ORIGIN:-true}
    volumes:
      - directus_uploads:/directus/uploads
    ports:
      - "127.0.0.1:8055:8055"   # прямой доступ только с localhost; наружу — через Caddy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8055/server/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging

  bootstrap:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    depends_on:
      directus:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO: ${SEED_DEMO:-false}
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DIRECTUS_SERVICE_TOKEN: ${DIRECTUS_SERVICE_TOKEN}
      TEST_EDITOR_EMAIL: ${TEST_EDITOR_EMAIL}
      TEST_EDITOR_PASSWORD: ${TEST_EDITOR_PASSWORD}
      TEST_ALUMNI_EMAIL: ${TEST_ALUMNI_EMAIL}
      TEST_ALUMNI_PASSWORD: ${TEST_ALUMNI_PASSWORD}
    restart: "no"   # одноразовый прогон; идемпотентен — можно запускать повторно
    security_opt:
      - no-new-privileges:true

  migrate:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CHECKOUT_DB_USER: ${CHECKOUT_DB_USER:-club_api}
      CHECKOUT_DB_PASSWORD: ${CHECKOUT_DB_PASSWORD:-}
    volumes:
      - ./apps/api/migrations:/migrations:ro
      - ./infra/indexes.sql:/indexes.sql:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      API_PORT: "3000"
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      DIRECTUS_URL: ${DIRECTUS_URL}
      DIRECTUS_SERVICE_TOKEN: ${DIRECTUS_SERVICE_TOKEN}
      CHECKOUT_DATABASE_URL: ${CHECKOUT_DATABASE_URL:-postgresql://${CHECKOUT_DB_USER:-club_api}:${CHECKOUT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      SUPPORT_OPERATOR_NAME: "${SUPPORT_OPERATOR_NAME:-Автономная некоммерческая организация «Клуб выпускников факультета права НИУ ВШЭ»}"
      SUPPORT_OPERATOR_ADDRESS: "${SUPPORT_OPERATOR_ADDRESS:-107061, г. Москва, ул. Большая Черкизовская, д. 3, к. 2, помещ. 17/1}"
      SUPPORT_OPERATOR_CONTACT: "${SUPPORT_OPERATOR_CONTACT:-Письменное обращение по юридическому адресу оператора}"
      SUPPORT_ENABLED: ${SUPPORT_ENABLED:-false}
      SUPPORT_RETENTION_DAYS: ${SUPPORT_RETENTION_DAYS:-30}
      SEED_DEMO: ${SEED_DEMO:-false}
      RESERVE_TTL_HOURS: ${RESERVE_TTL_HOURS:-72}
      MAIL_OUTBOX_MAX_ATTEMPTS: ${MAIL_OUTBOX_MAX_ATTEMPTS:-8}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      NEWS_SYNC_ENABLED: ${NEWS_SYNC_ENABLED:-false}
      TELEGRAM_REACTIONS_CHAT_ID: ${TELEGRAM_REACTIONS_CHAT_ID:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-pravohse_alumni_bot}
      OFFICE_EMAIL: ${OFFICE_EMAIL:-}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OFFICE_NOTIFY_CHANNEL: ${OFFICE_NOTIFY_CHANNEL}
      OFFICE_TG_BOT_TOKEN: ${OFFICE_TG_BOT_TOKEN}
      OFFICE_TG_CHAT_ID: ${OFFICE_TG_CHAT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Явный прод-флаг: включает fail-fast небезопасной конфигурации (env.ts).
      APP_ENV: ${APP_ENV:-development}
      # Публичный адрес — return_url оплаты, абсолютные URL sitemap/robots/canonical.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # Оплата ЮKassa (пусто = контур выключен, «заявка без оплаты»).
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      # Сроки хранения ПДн (152-ФЗ): заявки 3 года, аудит 1 год.
      ORDER_RETENTION_DAYS: ${ORDER_RETENTION_DAYS:-1095}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m
    stop_grace_period: 30s   # успеть плавно завершить активные запросы (SIGTERM → app.close)
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time конфиг SPA (Vite инлайнит в бандл — рантаймом не задать).
        # Site — публичный домен для og/canonical; Directus — база Studio/ассетов.
        VITE_SITE_URL: ${PUBLIC_URL:-http://localhost}
        VITE_DIRECTUS_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - web
      - api
      - directus
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8081"   # локальная админка через Caddy; на VPS не публичен
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Admin API Caddy на localhost:2019 — не зависит от домена/Host сайта.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging

volumes:
  pgdata:
  directus_uploads:
  caddy_data:
  caddy_config:
